// 2026-09-14: review-service로 실배포 파이프라인(ECR push + gitops-value 갱신)을
// 검증 완료 — 이 커밋은 build.gradle을 건드려서 detect-services.sh가 "전체 서비스
// 변경"으로 인식하게 하고, 나머지 6개 서비스도 같은 경로로 실제 검증하기 위한 것.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    springBootVersion = '4.1.0'
    springCloudVersion = '2025.1.2'
}

allprojects {
    group = 'com.golajugaenyang'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'io.spring.dependency-management'

    if (project.path.startsWith(':modules:')) {
        apply plugin: 'java-library'
    } else {
        apply plugin: 'java'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
        // Spring Boot 4.1.0이 물고 오는 내장 Tomcat(11.0.22)에 CRITICAL 취약점 3건
        // (CVE-2026-65182/65905/68525, 인증 우회 계열) — trivy 스캔에서 실제로 걸림
        // (2026-09-14). 셋 다 같은 버전으로 맞춰야 해서 embed 3종 전부 명시.
        dependencies {
            dependency 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
            dependency 'org.apache.tomcat.embed:tomcat-embed-el:11.0.25'
            dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }
}
