include:
  - local-infra/docker-compose.yml

services:
  api-gateway:
    build:
      context: .
      dockerfile: platform/api-gateway/Dockerfile
    profiles: ["all", "gateway"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      AUTH_SERVICE_HOST: auth-service
      MEMBER_SERVICE_HOST: member-service
      PRODUCT_SERVICE_HOST: product-service
      ORDER_SERVICE_HOST: order-service
      PAYMENT_SERVICE_HOST: payment-service
      REVIEW_SERVICE_HOST: review-service
      NOTIFICATION_SERVICE_HOST: notification-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    profiles: ["all", "auth"]
    depends_on: [postgres]
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      REDIS_HOST: redis
      MEMBER_SERVICE_HOST: member-service

  member-service:
    build:
      context: .
      dockerfile: services/member-service/Dockerfile
    profiles: ["all", "member"]
    depends_on: [postgres]
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      AUTH_SERVICE_URL: auth-service

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    profiles: ["all", "product"]
    depends_on: [postgres, kafka]
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    profiles: ["all", "order", "payment"]
    depends_on: [postgres, kafka, redis]
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      REDIS_HOST: redis
      PRODUCT_SERVICE_HOST: product-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    profiles: ["all", "payment"]
    depends_on: [postgres, kafka, order-service]
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_SERVICE_HOST: order-service

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    profiles: ["all", "review"]
    depends_on: [postgres, kafka]
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    profiles: ["all", "notification"]
    depends_on: [postgres, kafka]
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
