internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}

spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: https://leechs.shop/api/auth/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: account_email
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://leechs.shop/api/auth/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

oauth2:
  frontend-redirect-uri: https://${FRONTEND_DOMAIN:leechs.shop}/auth/callback

jwt:
  expiration:
    access: 3600
    refresh: 604800
  rsa:
    private-key: ${JWT_RSA_PRIVATE_KEY}

member-service:
  url: ${MEMBER_SERVICE_URL}
