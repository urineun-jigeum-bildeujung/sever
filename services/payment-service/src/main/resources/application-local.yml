server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

toss-payments:
  base-url: https://api.tosspayments.com
  secret-key: ${TOSS_SECRET_KEY}
  connect-timeout: 2s
  read-timeout: 5s

order-service:
  base-url: http://${ORDER_SERVICE_HOST:localhost}:8084
  connect-timeout: 1s
  read-timeout: 2s

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}