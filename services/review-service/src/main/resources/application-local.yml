server:
  port: 8086

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}

member-service:
  url: http://${MEMBER_SERVICE_HOST:localhost}:8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/review_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
