server:
  port: 8086

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}

member-service:
  url: http://${MEMBER_SERVICE_HOST:localhost}:8082

order-service:
  url: http://${ORDER_SERVICE_HOST:localhost}:8084

storage:
  bucket: ${STORAGE_BUCKET:petflow-dev-uploads}
  region: ${STORAGE_REGION:ap-northeast-2}
  cloudfront-domain: ${STORAGE_CLOUDFRONT_DOMAIN:https://image.leechs.shop}
  prefix: reviews

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/review_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
