spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        default_batch_fetch_size: 100
        type:
          json_format_mapper: com.golajugaenyang.order.config.OrderJacksonJsonFormatMapper

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

order:
  reservation:
    ttl: 15m