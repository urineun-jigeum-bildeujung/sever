server:
  port: 8082

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}

auth-service:
  url: http://${AUTH_SERVICE_HOST:localhost}:8081

product-service:
  url: http://${PRODUCT_SERVICE_HOST:localhost}:8083

storage:
  bucket: ${STORAGE_BUCKET:petflow-dev-uploads}
  region: ${STORAGE_REGION:ap-northeast-2}
  cloudfront-domain: ${STORAGE_CLOUDFRONT_DOMAIN:https://image.leechs.shop}
  prefix: profiles

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/member_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
