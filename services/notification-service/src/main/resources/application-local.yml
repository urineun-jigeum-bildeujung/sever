server:
  port: 8087

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET}

product-service:
  url: http://${PRODUCT_SERVICE_HOST:localhost}:8083

fcm:
  credentials-path: ${FCM_CREDENTIALS_PATH:}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
